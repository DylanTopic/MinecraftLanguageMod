plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

base {
	archivesName = project.name
}

repositories {
	// Loom adds the Fabric, Mojang and Maven Central repositories automatically.
	maven {
		name = "Terraformers (Mod Menu)"
		url = "https://maven.terraformersmc.com/"
		content {
			includeGroup "com.terraformersmc"
		}
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"langmod" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

// Client game tests live in src/gametest and run with `./gradlew runClientGameTest`.
// They start a real client, create a world and exercise the mod (see LangModClientGameTest).
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "langmod-gametest"
		enableGameTests = false
		enableClientGameTests = true
	}
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// whisper.cpp JNI bindings with bundled native libraries (Windows x64, Linux, macOS),
	// shipped inside the mod jar.
	implementation "io.github.givimad:whisper-jni:${project.whisper_jni_version}"
	include "io.github.givimad:whisper-jni:${project.whisper_jni_version}"

	// Mod Menu is optional: compile against its API, and put it in the development client so
	// the settings screen can be opened from the mods list. It is not bundled.
	compileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	localRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	testImplementation "net.fabricmc:fabric-loader-junit:${project.loader_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
	it.options.encoding = "UTF-8"
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

test {
	useJUnitPlatform()
}

jar {
	// A plain string, like `version` above: the configuration cache cannot resolve the task's
	// properties inside the rename closures when the task runs.
	def archivesName = project.base.archivesName.get()
	inputs.property "archivesName", archivesName

	// The licence and the third-party notices travel inside the mod jar.
	from("LICENSE") {
		rename { "${it}_${archivesName}" }
	}
	from("THIRD_PARTY_NOTICES.md") {
		rename { "THIRD_PARTY_NOTICES_${archivesName}.md" }
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
