# Checks the real speech pipeline (whisper-jni + Whisper "small" model + OpenCC + pinyin) on
# synthesised Mandarin samples. Linux compares several ways of calling Whisper (accuracy and
# speed); Windows checks that the bundled native library loads and runs. Runs when speech code
# changes, or by hand from the Actions tab.

name: speech
on:
  push:
    paths:
      - 'src/main/java/io/github/dylantopic/langmod/core/speech/**'
      - 'src/main/java/io/github/dylantopic/langmod/core/text/**'
      - 'src/test/java/io/github/dylantopic/langmod/speech/**'
      - 'src/main/resources/assets/langmod/opencc/**'
      - '.github/speech/**'
      - '.github/workflows/speech.yml'
  workflow_dispatch:
    inputs:
      variants:
        description: 'SpeechCheck variants to run on Linux (comma-separated)'
        default: 'plain,biased,fit,fit-biased'

concurrency:
  group: speech-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install text-to-speech
        run: pip install --quiet edge-tts imageio-ffmpeg
      - name: synthesise samples
        run: python3 .github/speech/make_samples.py .github/speech/samples.tsv samples
      - uses: actions/upload-artifact@v7
        with:
          name: speech-samples
          path: samples/

  check:
    needs: samples
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            variants: mc512,hint512,ctx768,mc768,biased512
            samples: 100
          - os: windows-2025
            variants: mc512
            samples: 4
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    env:
      MODEL: small
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v7
        with:
          name: speech-samples
          path: samples
      - name: cache whisper model
        uses: actions/cache@v6
        with:
          path: models
          key: whisper-ggml-${{ env.MODEL }}-v1
      - name: download whisper model
        run: |
          mkdir -p models libs
          if [ ! -f models/ggml-$MODEL.bin ]; then
            curl -sSfL -o models/ggml-$MODEL.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$MODEL.bin
          fi
          ls -la models
      - name: download libraries
        run: |
          M=https://repo1.maven.org/maven2
          curl -sSfL -o libs/whisper-jni.jar $M/io/github/givimad/whisper-jni/1.7.1/whisper-jni-1.7.1.jar
          curl -sSfL -o libs/gson.jar $M/com/google/code/gson/gson/2.13.1/gson-2.13.1.jar
      - name: compile
        run: |
          SEP=':'; [ "$RUNNER_OS" = "Windows" ] && SEP=';'
          find src/main/java/io/github/dylantopic/langmod/core -name '*.java' > sources.txt
          echo src/test/java/io/github/dylantopic/langmod/speech/SpeechCheck.java >> sources.txt
          javac -encoding UTF-8 --release 25 -cp "libs/whisper-jni.jar${SEP}libs/gson.jar" -d out @sources.txt
      - name: transcribe samples
        env:
          VARIANTS: ${{ github.event.inputs.variants != '' && matrix.os == 'ubuntu-24.04' && github.event.inputs.variants || matrix.variants }}
        run: |
          SEP=':'; [ "$RUNNER_OS" = "Windows" ] && SEP=';'
          cat samples/engines.txt
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 --enable-native-access=ALL-UNNAMED \
            -cp "out${SEP}libs/whisper-jni.jar${SEP}libs/gson.jar" \
            io.github.dylantopic.langmod.speech.SpeechCheck models/ggml-$MODEL.bin samples 2 "$VARIANTS" ${{ matrix.samples }}
