# Builds the mod, runs unit tests, then starts a real (headless) client and runs the
# client game tests in src/gametest. Screenshots and logs are uploaded as artifacts.

name: build
on:
  push:
    paths-ignore:
      - '.github/speech/**'
      - '.github/workflows/speech.yml'
  pull_request:
  workflow_dispatch:

# Read-only token: no step needs to change the repository.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: check the mod jar
        run: |
          # The jar players install must carry whisper-jni (with its native libraries) inside it.
          JAR=$(ls build/libs/*.jar | grep -v -- -sources)
          unzip -l "$JAR" | grep -E "META-INF/jars/whisper-jni-[0-9.]+\.jar"
          unzip -p "$JAR" fabric.mod.json | grep -q '"META-INF/jars/whisper-jni' || { echo "fabric.mod.json does not list the nested whisper-jni jar"; exit 1; }
      - name: store build reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports
          path: |
            **/build/reports/
            **/build/test-results/
      - name: install xvfb
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      - name: client game tests
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ./gradlew runClientGameTest --stacktrace
      - name: upload game test screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: client-game-test
          path: |
            build/run/clientGameTest/screenshots/
            build/run/clientGameTest/logs/
            build/run/clientGameTest/crash-reports/
          if-no-files-found: ignore
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/

  # The same build on Windows, where most players are: compiles, runs the unit tests and makes the jar.
  windows:
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: setup gradle (with dependency cache)
        uses: gradle/actions/setup-gradle@v6
        with:
          add-job-summary: never
      - name: build
        run: .\gradlew.bat build --stacktrace
      - name: list the built jars
        run: Get-ChildItem build\libs

  # Short, separate log with just the game test outcome (easier to read than the build log).
  report:
    needs: build
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: client-game-test
          path: gametest
        continue-on-error: true
      - name: game test summary
        run: |
          grep -h -E "LANGMOD-|Exception|AssertionError|Error:|/ERROR\]" gametest/logs/latest.log 2>/dev/null | grep -v "GL ERROR\|X11:\|@ Render" | cut -c1-400 | tail -60 || echo "no game test log"
          ls gametest/crash-reports 2>/dev/null && head -60 gametest/crash-reports/* || true
