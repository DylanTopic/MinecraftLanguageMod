# Research: how well Whisper hears item names in languages LangMod might add.
# Not part of the normal checks; it runs when the survey files change or by hand.
name: survey

on:
  push:
    paths:
      - '.github/survey/**'
      - 'src/test/java/io/github/dylantopic/langmod/survey/**'
      - '.github/workflows/survey.yml'
  workflow_dispatch:

concurrency:
  group: survey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  samples:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: install text-to-speech
        run: pip install --quiet edge-tts imageio-ffmpeg
      - name: synthesise samples
        run: python3 .github/speech/make_samples.py .github/survey/survey.tsv samples
      - uses: actions/upload-artifact@v7
        with:
          name: survey-samples
          path: samples/

  survey:
    needs: samples
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MODEL: medium
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - uses: actions/download-artifact@v7
        with:
          name: survey-samples
          path: samples
      - name: cache whisper model
        uses: actions/cache@v6
        with:
          path: models
          key: whisper-ggml-${{ env.MODEL }}-v1
      - name: download whisper model and libraries
        run: |
          mkdir -p models libs
          if [ ! -f models/ggml-$MODEL.bin ]; then
            curl -sSfL -o models/ggml-$MODEL.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-$MODEL.bin
          fi
          M=https://repo1.maven.org/maven2
          curl -sSfL -o libs/whisper-jni.jar $M/io/github/givimad/whisper-jni/1.7.1/whisper-jni-1.7.1.jar
          curl -sSfL -o libs/gson.jar $M/com/google/code/gson/gson/2.13.1/gson-2.13.1.jar
      - name: compile
        run: |
          find src/main/java/io/github/dylantopic/langmod/core -name '*.java' > sources.txt
          find src/test/java/io/github/dylantopic/langmod/survey -name '*.java' >> sources.txt
          javac -encoding UTF-8 --release 25 -cp "libs/whisper-jni.jar:libs/gson.jar" -d out @sources.txt
      - name: transcribe
        run: |
          java -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 --enable-native-access=ALL-UNNAMED \
            -cp "out:libs/whisper-jni.jar:libs/gson.jar" io.github.dylantopic.langmod.survey.SpeechSurvey models/ggml-$MODEL.bin samples 2
